<radialGradient id="glow"><stop stop-color="#2d888c" stop-opacity=".3"/><stop offset="1" stop-color="#2d888c" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#94d4df" stroke-opacity=".055" fill="none"/></pattern>
<clipPath id="clip"><rect width="1280" height="380" rx="22"/></clipPath>
</defs>
