<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
<title id="title">Ajay Pokhrel — Mechanical Engineer and Educator</title>
<desc id="desc">CFD, heat transfer and thermal systems. Abstract schematic flow lines and a thermal colour spectrum; decorative illustration, not simulation results.</desc>
<defs>
