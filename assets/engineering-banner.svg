<text x="54" y="132" fill="#f4f7fa" font-family="Segoe UI,Arial,sans-serif" font-size="62" font-weight="700" letter-spacing="-1">Ajay Pokhrel</text>
<text x="58" y="176" fill="#c4d4df" font-family="Segoe UI,Arial,sans-serif" font-size="25">Mechanical Engineer &amp; Educator</text>
<text x="58" y="228" fill="#f4f7fa" font-family="Segoe UI,Arial,sans-serif" font-size="21">Exploring how fluids flow and heat moves.</text>
<text x="58" y="260" fill="#9db4c5" font-family="Segoe UI,Arial,sans-serif" font-size="17">Simulation, practical engineering, and shared learning.</text>
